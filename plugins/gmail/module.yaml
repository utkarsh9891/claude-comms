# Machine-readable module manifest. Agents parse this to map the repo; keep it in sync with the files it names.
id: gmail
type: plugin
purpose: >
  Claude Code plugin that installs gmail-send: send email with local attachments from any terminal through the
  Gmail API (or save a draft, or reply in a thread quoting the original), signed in with the owner's own
  Desktop-app OAuth client (gmail.compose + gmail.readonly + openid + email; reads only the email being answered). The refresh token is stored only encrypted to a Secure Enclave key that needs Touch ID for
  every use (the Gmail for Claude helper), so every send and draft needs a scan; attachments come only from the
  send folders. No bridge, no session, nothing
  shared with the WhatsApp plugin at runtime. Decisions: ADR 2026-11-05-d38d84, ADR 2026-11-05-847f76.
consumes: []            # Python standard library only, run by uv
language: python
runtime:
  python: ">=3.11"
data_dir: "$GMAIL_SEND_HOME (default ~/.gmail-send): client.json, config.json, signature.html, armed.json (while armed), token.sealed, key.se (0600), app/"
secrets: "refresh token sealed to a Touch ID-only Secure Enclave key (token.sealed + key.se)"
interfaces:
  - "gmail-send <to> -s <subject> [--cc …] [--file …] [--html <file>] [--draft] [--dry-run] [text… | -]"
  - "gmail-send --reply-to <message id> [--all] [--no-quote] [--to …] [--cc …] [-s …] [--draft] [--dry-run] [text…]"
  - "gmail-send --arm <to> [--cc …] -s <subject pattern> [--for ≤1h] [--times ≤20] <text pattern> | --armed | --disarm [<id>]"
  - "gmail-send setup <client_secret.json> | login | status | logout | signature [--refresh]"
  - "GET https://gmail.googleapis.com/gmail/v1/users/me/messages/<id>?format=raw (replies; format=metadata with --no-quote)"
  - "POST https://gmail.googleapis.com/upload/gmail/v1/users/me/messages/send?uploadType=media (message/rfc822)"
  - "POST https://gmail.googleapis.com/upload/gmail/v1/users/me/drafts?uploadType=media (message/rfc822)"
  - "runs ~/.gmail-send/app/Gmail for Claude seal <dir> (token on stdin) | open <dir> <reason> (Touch ID, token on stdout) | test <reason>"
manifests:
  plugin: ./.claude-plugin/plugin.json
  marketplace: ../../.claude-plugin/marketplace.json
guard_files:            # CODEOWNERS-protected; see docs/architecture/security-model.md#gmail
  - ./bin/gmailsend.py
  - ./approve/gmail-approve.swift
  - ./bin/install.sh
docs:
  readme: ./README.md
  design: ../../docs/architecture/decisions/2026-11-05-d38d84-gmail-send-through-the-gmail-api.md
  design_armed: ../../docs/architecture/decisions/2026-11-05-c41e0b-gmail-armed-sends-one-hour-key.md
  design_replies: ../../docs/architecture/decisions/2026-11-05-847f76-gmail-replies-read-headers-behind-their-own-scan.md
  security: ../../docs/architecture/security-model.md#gmail
commands:
  test: "uv run --no-project --with pytest python -m pytest tests -q && shellcheck bin/install.sh"
  install: "bin/install.sh"
  status: "bin/install.sh status"
owners:
  - utkarsh9891
